<!DOCTYPE html>
<html lang="pt-PT" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Título e descrição da página inicial em português. O WhatsApp e as redes
         sociais não correm JavaScript e leem só isto, em todas as páginas. Com
         JavaScript, o SEO.js reescreve-os com os valores da página em que se
         está. Os textos estão também no SEO.js: mudar um obriga a mudar o outro. -->
    <title>Nexugal</title>
    <meta name="description" content="Reformulação de operações com gestão implementada" />

    <!-- Keywords (ainda útil para alguns motores) -->
    <meta name="keywords" content="consultoria tecnológica, desenvolvimento web, cibersegurança, soluções cloud, inteligência artificial, análise de dados, transformação digital, NEXUGAL, IT consulting, web development, cybersecurity" />

    <!-- Autor -->
    <meta name="author" content="NEXUGAL" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Sem canonical nem hreflang aqui, de propósito. Este ficheiro é o mesmo
         para todas as páginas, e o que aqui estivesse dizia à FAQ que era a
         página inicial. O SEO.js escreve os certos em cada página, e o
         sitemap.xml também declara os hreflang. -->

    <!-- Theme & Cor -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="msapplication-TileColor" content="#0F2E5C" />

    <!-- Favicon -->
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/favicon.png" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp)
         A imagem de partilha é um PNG de 1200 por 630: o tipo e as medidas
         declarados aqui têm de bater certo com o ficheiro. Uma imagem nova vai
         com um nome novo, porque o WhatsApp e as redes guardam a antiga pelo
         endereço e continuariam a mostrá-la. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEXUGAL" />
    <meta property="og:title" content="Nexugal" />
    <meta property="og:description" content="Reformulação de operações com gestão implementada" />
    <meta property="og:url" content="https://www.nexugal.com/" />
    <meta property="og:image" content="https://www.nexugal.com/images/nexugal-partilha.png" />
    <meta property="og:image:secure_url" content="https://www.nexugal.com/images/nexugal-partilha.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Menos tarefas repetidas. Mais tempo para o que importa." />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexugal" />
    <meta name="twitter:description" content="Reformulação de operações com gestão implementada" />
    <meta name="twitter:image" content="https://www.nexugal.com/images/nexugal-partilha.png" />
    <meta name="twitter:image:alt" content="Menos tarefas repetidas. Mais tempo para o que importa." />

    <!-- Preconnect para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Letras do site, num pedido só e apenas com os pesos usados:
         Space Grotesk nos títulos, Inter no texto corrido, Orbitron só no
         logótipo. display=swap mostra o texto de imediato com a letra do
         sistema e troca assim que a definitiva chega. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@700&family=Space+Grotesk:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <!-- Este ficheiro é o mesmo em português e em inglês, e sem JavaScript não
         há forma de saber qual das línguas se pediu: vão as duas. -->
    <noscript>
      <p>É preciso ativar o JavaScript para ver este site.</p>
      <p lang="en">You need to enable JavaScript to view this site.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
