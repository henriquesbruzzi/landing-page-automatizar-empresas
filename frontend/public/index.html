<!DOCTYPE html>
<html lang="pt-PT" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Título principal — será sobrescrito pelo React Helmet por rota -->
    <title>NEXUGAL — Consultoria Tecnológica | Desenvolvimento Web, Cibersegurança & Cloud</title>

    <!-- Meta description rica em keywords -->
    <meta name="description" content="NEXUGAL — Consultoria tecnológica em Braga, Portugal. Especialistas em desenvolvimento web, cibersegurança, soluções cloud, inteligência artificial e análise de dados. Transformação digital para a sua empresa." />

    <!-- Keywords (ainda útil para alguns motores) -->
    <meta name="keywords" content="consultoria tecnológica, desenvolvimento web, cibersegurança, soluções cloud, inteligência artificial, análise de dados, transformação digital, Braga, Portugal, NEXUGAL, IT consulting, web development, cybersecurity" />

    <!-- Autor -->
    <meta name="author" content="NEXUGAL" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical (base — será sobrescrito por rota com React Helmet) -->
    <link rel="canonical" href="https://www.nexugal.com/" />

    <!-- Hreflang para SEO multilingue -->
    <link rel="alternate" hreflang="pt" href="https://www.nexugal.com/" />
    <link rel="alternate" hreflang="en" href="https://www.nexugal.com/us" />
    <link rel="alternate" hreflang="x-default" href="https://www.nexugal.com/" />

    <!-- Theme & Cor -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />

    <!-- Favicon -->
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/favicon.png" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEXUGAL" />
    <meta property="og:title" content="NEXUGAL — Consultoria Tecnológica | Desenvolvimento Web, Cibersegurança & Cloud" />
    <meta property="og:description" content="Consultoria tecnológica em Braga, Portugal. Especialistas em desenvolvimento web, cibersegurança, soluções cloud, IA e análise de dados." />
    <meta property="og:url" content="https://www.nexugal.com/" />
    <meta property="og:image" content="https://www.nexugal.com/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NEXUGAL — Codificando o Amanhã da sua Empresa" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEXUGAL — Consultoria Tecnológica" />
    <meta name="twitter:description" content="Consultoria tecnológica em Braga, Portugal. Desenvolvimento web, cibersegurança, cloud, IA e análise de dados." />
    <meta name="twitter:image" content="https://www.nexugal.com/images/og-image.png" />
    <meta name="twitter:image:alt" content="NEXUGAL — Codificando o Amanhã da sua Empresa" />

    <!-- Geolocalização para SEO local -->
    <meta name="geo.region" content="PT-03" />
    <meta name="geo.placename" content="Braga" />
    <meta name="geo.position" content="41.5518;-8.4229" />
    <meta name="ICBM" content="41.5518, -8.4229" />

    <!-- Preconnect para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Letras do site, num pedido só e apenas com os pesos usados:
         Space Grotesk nos títulos, Inter no texto corrido, Orbitron só no
         logótipo. display=swap mostra o texto de imediato com a letra do
         sistema e troca assim que a definitiva chega. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@700&family=Space+Grotesk:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este app.</noscript>
    <div id="root"></div>
  </body>
</html>
